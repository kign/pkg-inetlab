[metadata]
name = inetlab
version = 0.1.15
author = Konstantin Ignatiev
author_email = kostya@inet-lab.net
description = Python helper libraries for Web/GAE/Flask, HTML manipulation and command line tools
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/kign/pkg-inetlab
project_urls =
    Bug Tracker = https://github.com/kign/pkg-inetlab/issues
license = "GPL-2.0-only"    
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.12

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    inetlab-send-test = inetlab.mail.xmail:test
